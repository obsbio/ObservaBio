name: deploy-site

# The landing page is a Quarto project in website/. `_site/` is not tracked
# (.gitignore), so the Action renders the page and publishes the result.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live site: cancel a superseded run, but let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # index.qmd holds one raw `{=html}` block and no executable chunk, so
      # Quarto renders it without R, Python or Jupyter.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'

      - name: Render the landing page
        run: quarto render
        working-directory: website

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
