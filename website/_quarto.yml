project:
  type: website
  output-dir: _site
  resources:
    - assets/

website:
  title: "ObservaBio"
  description: >-
    Aplicativo R/Shiny que resolve nomes científicos em bases nacionais e
    internacionais, cruza o status de conservação e as listas de exóticas
    invasoras, e confere pelas ocorrências do GBIF se a espécie faz sentido
    onde você diz que ela está.
  favicon: assets/img/favicon.svg
  open-graph: true
  page-navigation: false
  # Página única: sem navbar, sem sidebar, sem busca.
  # O site-url só alimenta as tags open-graph e o canonical. Os caminhos da
  # página seguem relativos, então `_site/index.html` continua abrindo direto
  # do disco.
  site-url: https://obsbio.github.io/ObservaBio/
  repo-url: https://github.com/obsbio/ObservaBio

format:
  html:
    lang: pt-BR
    theme: theme.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header: assets/head.html
    include-after-body: assets/foot.html
